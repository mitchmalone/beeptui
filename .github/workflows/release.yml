name: Release

# Build the standalone binary on a version tag and attach it to a GitHub Release.
# Native runners per target: OpenTUI ships a platform-specific native renderer, so
# `bun build --compile` must run on each target OS rather than cross-compiling.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create releases + upload assets

env:
  BUN_VERSION: '1.3.14'

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            target: darwin-arm64
          - os: ubuntu-latest # x64
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate the release on a green build — never ship an untested binary.
      - name: Verify
        run: |
          bun run typecheck
          bun test

      - name: Compile standalone binary
        run: bun build src/cli/index.ts --compile --outfile dist/beeper-tui-${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeper-tui-${{ matrix.target }}
          path: dist/beeper-tui-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release + attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/beeper-tui-*
