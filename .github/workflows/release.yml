name: Release

# Build the standalone binary on a version tag and attach it to a GitHub Release.
# Native runners per target: OpenTUI ships a platform-specific native renderer, so
# `bun build --compile` must run on each target OS rather than cross-compiling.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create releases + upload assets

env:
  BUN_VERSION: '1.3.14'

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            target: darwin-arm64
          - os: ubuntu-latest # x64
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate the release on a green build — never ship an untested binary.
      - name: Verify
        run: |
          bun run typecheck
          bun test

      # Stamp the release version from the tag so the binary can't drift from
      # package.json (single source of truth = the tag). See DECISIONS/plan.
      - name: Stamp version from tag
        env:
          REF: ${{ github.ref_name }}
        run: |
          v="${REF#v}"
          V="$v" bun -e 'const f="apps/cli/package.json"; const p=await Bun.file(f).json(); p.version=process.env.V; await Bun.write(f, JSON.stringify(p,null,2)+"\n")'
          echo "Stamped apps/cli/package.json version -> $v"

      - name: Compile standalone binary
        run: bun build apps/cli/src/cli/index.ts --compile --outfile dist/beeptui-${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: beeptui-${{ matrix.target }}
          path: dist/beeptui-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # Publish checksums so users (and the Homebrew formula) can verify the
      # binaries. `shasum -a 256` is present on both macOS and Linux runners.
      - name: Generate checksums
        run: |
          cd artifacts
          shasum -a 256 beeptui-* | tee sha256sums.txt

      - name: Create release + attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/beeptui-* artifacts/sha256sums.txt

  # Update the Homebrew tap so `brew upgrade` picks up the new binary. Runs only
  # when a tap is configured (repo variable HOMEBREW_TAP_REPO + secret
  # HOMEBREW_TAP_TOKEN); otherwise the job is skipped — an honest no-op, never a
  # failed release.
  homebrew:
    name: update homebrew tap
    needs: release
    if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # this repo, for the formula renderer

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Render formula
        env:
          FORMULA_VERSION: ${{ github.ref_name }}
          FORMULA_REPO: ${{ github.repository }}
        run: |
          darwin=$(shasum -a 256 artifacts/beeptui-darwin-arm64 | cut -d' ' -f1)
          linux=$(shasum -a 256 artifacts/beeptui-linux-x64 | cut -d' ' -f1)
          FORMULA_SHA_DARWIN_ARM64="$darwin" FORMULA_SHA_LINUX_X64="$linux" \
            bun run apps/cli/src/packaging/homebrew.ts > beeptui.rb
          cat beeptui.rb

      - name: Commit to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          mkdir -p tap/Formula
          cp beeptui.rb tap/Formula/beeptui.rb
          cd tap
          # Retire the pre-rename formula if it's still present (see DECISIONS.md 2026-08-03).
          git rm --ignore-unmatch Formula/beeper-tui.rb
          cat > README.md <<'EOF'
          # homebrew-tap

          Homebrew tap for [beeptui](https://github.com/mitchmalone/beeptui).

          ```sh
          brew install mitchmalone/tap/beeptui
          ```

          `Formula/beeptui.rb` is generated automatically on each `v*` release of the
          main repo — do not edit by hand.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "beeptui ${{ github.ref_name }}"
          git push

  # Stamp the released version into the website repo so beeptui.com renders the
  # real version instead of a hand-maintained string. Same shape as the tap job:
  # runs only when configured (repo variable WEB_REPO + secret WEB_REPO_TOKEN),
  # otherwise an honest no-op — never a failed release.
  website:
    name: update website version
    needs: release
    if: ${{ vars.WEB_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Commit release.json to the website repo
        env:
          GH_TOKEN: ${{ secrets.WEB_REPO_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          # The if-gate can only see vars, not secrets: without the token the
          # clone would fail the job. Same honest no-op as an unset WEB_REPO.
          if [ -z "${GH_TOKEN}" ]; then
            echo "WEB_REPO_TOKEN not configured — skipping website stamp"
            exit 0
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.WEB_REPO }}.git" web
          mkdir -p web/src/data
          printf '{\n  "version": "%s",\n  "date": "%s"\n}\n' "${REF#v}" "$(date -u +%F)" > web/src/data/release.json
          cd web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/release.json
          if git diff --cached --quiet; then
            echo "version unchanged — nothing to push"
            exit 0
          fi
          git commit -m "chore: stamp release ${REF} from the app release workflow"
          git push
