name: Release

# Build the standalone binary on a version tag and attach it to a GitHub Release.
# Native runners per target: OpenTUI ships a platform-specific native renderer, so
# `bun build --compile` must run on each target OS rather than cross-compiling.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create releases + upload assets

env:
  BUN_VERSION: '1.3.14'

jobs:
  # Release notes are written first, from docs/releases/_TEMPLATE.md — no notes
  # file for this tag, no release. The website version stamp ships in the same
  # release-prep commit (apps/www/src/data/release.json), so the site and the
  # binary can never disagree about what's released.
  gate:
    name: release-notes gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require release notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::missing $NOTES — write release notes before tagging"
            exit 1
          fi
          if grep -qE 'vX\.Y\.Z|<!-- Written BEFORE' "$NOTES"; then
            echo "::error::$NOTES still contains template placeholders"
            exit 1
          fi

      - name: Require a matching website release stamp
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          stamped=$(python3 -c "import json; print(json.load(open('apps/www/src/data/release.json'))['version'])")
          if [ "$stamped" != "$tag_version" ]; then
            echo "::error::apps/www/src/data/release.json says ${stamped}, tag says ${tag_version} — stamp it in the release-prep commit"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            target: darwin-arm64
          - os: ubuntu-latest # x64
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate the release on a green build — never ship an untested binary.
      - name: Verify
        run: |
          bun run typecheck
          bun test

      # Stamp the release version from the tag so the binary can't drift from
      # package.json (single source of truth = the tag). See DECISIONS/plan.
      - name: Stamp version from tag
        env:
          REF: ${{ github.ref_name }}
        run: |
          v="${REF#v}"
          V="$v" bun -e 'const f="apps/cli/package.json"; const p=await Bun.file(f).json(); p.version=process.env.V; await Bun.write(f, JSON.stringify(p,null,2)+"\n")'
          echo "Stamped apps/cli/package.json version -> $v"

      - name: Compile standalone binary
        run: bun build apps/cli/src/cli/index.ts --compile --outfile dist/beeptui-${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: beeptui-${{ matrix.target }}
          path: dist/beeptui-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # for the release-notes file

      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # Publish checksums so users (and the Homebrew formula) can verify the
      # binaries. `shasum -a 256` is present on both macOS and Linux runners.
      - name: Generate checksums
        run: |
          cd artifacts
          shasum -a 256 beeptui-* | tee sha256sums.txt

      - name: Create release + attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "docs/releases/${{ github.ref_name }}.md" \
            artifacts/beeptui-* artifacts/sha256sums.txt

  # Update the Homebrew tap so `brew upgrade` picks up the new binary. Runs only
  # when a tap is configured (repo variable HOMEBREW_TAP_REPO + secret
  # HOMEBREW_TAP_TOKEN); otherwise the job is skipped — an honest no-op, never a
  # failed release.
  homebrew:
    name: update homebrew tap
    needs: release
    if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # this repo, for the formula renderer

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Render formula
        env:
          FORMULA_VERSION: ${{ github.ref_name }}
          FORMULA_REPO: ${{ github.repository }}
        run: |
          darwin=$(shasum -a 256 artifacts/beeptui-darwin-arm64 | cut -d' ' -f1)
          linux=$(shasum -a 256 artifacts/beeptui-linux-x64 | cut -d' ' -f1)
          FORMULA_SHA_DARWIN_ARM64="$darwin" FORMULA_SHA_LINUX_X64="$linux" \
            bun run apps/cli/src/packaging/homebrew.ts > beeptui.rb
          cat beeptui.rb

      - name: Commit to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          mkdir -p tap/Formula
          cp beeptui.rb tap/Formula/beeptui.rb
          cd tap
          # Retire the pre-rename formula if it's still present (see DECISIONS.md 2026-08-03).
          git rm --ignore-unmatch Formula/beeper-tui.rb
          # The tap is SHARED across Mitch's projects (2026-08-12) — this job owns
          # Formula/beeptui.rb and nothing else. The README is hand-edited in the
          # tap repo; never rewrite it from here.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "beeptui ${{ github.ref_name }}"
          git push
