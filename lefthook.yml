# Layers add hooks as fragments under .lefthook/ (gitleaks from +public).
extends:
  - .lefthook/*.yml

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      # apps/www lints with its own eslint-config-next setup (root `lint` chains
      # it; pre-push verify covers it) — passing its files to the root ESLint
      # would resolve its nearest config under the wrong ESLint major.
      exclude:
        - apps/www/**
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,js,mjs,json,md,css,yml,yaml}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: bun run verify
